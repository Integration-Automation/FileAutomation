name: Integration

# The storage contract suite against real services, and the unit tests on the other two platforms.
# Neither job gates a release: publishing depends on the jobs of ci-dev.yml and ci-stable.yml.

on:
  pull_request:
    branches: [ "dev", "main" ]
  push:
    branches: [ "dev" ]
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    # One service per job, each started in a container by tests/integration/start_service.sh.
    # FA_IT_REQUIRED turns a test module that would skip (its variables are missing) into an error.
    runs-on: ubuntu-latest
    timeout-minutes: 20  # no run yet: to revisit after the first runs
    strategy:
      fail-fast: false
      matrix:
        service: [ s3, azure, sftp, ftp, webdav, smb ]
    env:
      SERVICE: ${{ matrix.service }}
      FA_IT_REQUIRED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with every extra
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/integration.txt
          cp dev.toml pyproject.toml
          python -m pip install --no-deps --no-build-isolation --only-binary :all: -e .
      - name: Start the service
        run: bash tests/integration/start_service.sh "$SERVICE"
      - name: Run the contract suite against it
        run: python -m pytest tests/integration/test_"$SERVICE"_*.py -v --tb=short
      - name: Show the service log
        if: failure()
        run: docker logs "fa-it-$SERVICE" || true

  platforms:
    # ci-dev.yml and ci-stable.yml run the unit tests on Windows. These are the other two.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20  # no run yet: to revisit after the first runs
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the libraries Qt needs without a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install the package with every extra
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/integration.txt
          cp dev.toml pyproject.toml
          python -m pip install --no-deps --no-build-isolation --only-binary :all: -e .
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short
