name: CI (stable)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          # mypy reads je_action_core's types (py.typed) for the classes built on it
          pip install ruff mypy "je_action_core>=0.0.2"
      - name: Ruff check
        run: ruff check automation_file tests
      - name: Ruff format check
        run: ruff format --check automation_file tests
      - name: Mypy
        run: mypy automation_file

  pytest:
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 15  # about 3x the slowest recent run, at least 15
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip wheel
          Copy-Item stable.toml pyproject.toml -Force
          # Every extra, so every backend's tests run. The minimal job runs without any.
          pip install -e ".[all,test]"
      - name: Run pytest with coverage
        run: python -m pytest tests/ -v --tb=short --cov=automation_file --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  minimal:
    # The base install: no cloud SDK and no GUI toolkit. The tests of a backend whose extra is
    # missing skip; everything else, the import guard included, has to pass.
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 15  # no run yet: the floor of 15 minutes, to revisit after the first runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the base package
        run: |
          python -m pip install --upgrade pip wheel
          Copy-Item stable.toml pyproject.toml -Force
          pip install -e ".[test]"
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  extras:
    # Each extra on its own: it installs, and its backend's tests run with no other SDK present.
    needs: lint
    runs-on: windows-latest
    timeout-minutes: 15  # no run yet: the floor of 15 minutes, to revisit after the first runs
    strategy:
      fail-fast: false
      matrix:
        extra: [ s3, azure, gdrive, dropbox, sftp, ftp, webdav, smb, fsspec, onedrive, box, parquet, gui ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the package with one extra
        run: |
          python -m pip install --upgrade pip wheel
          Copy-Item stable.toml pyproject.toml -Force
          pip install -e ".[${{ matrix.extra }},test]"
      - name: Run pytest
        run: python -m pytest tests/ -v --tb=short

  package:
    # The sdist and the wheel build from stable.toml and their metadata renders, before anything is
    # merged. It gates nothing: the publish job builds again from the locked tools.
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15  # no run yet: the floor of 15 minutes, to revisit after the first runs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the distribution and check its metadata
        run: |
          # The locked, wheels-only tools the publish jobs build with.
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt
          cp stable.toml pyproject.toml
          python -m build --no-isolation
          twine check dist/*
