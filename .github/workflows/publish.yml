name: Publish to PyPI

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # about 3x the slowest recent run, at least 15
    if: "!contains(github.event.head_commit.message, 'chore: bump version')"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: true  # this job pushes
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      # This job holds the PyPI token, so its tools are hash-locked and wheels only.
      # .github/requirements/publish.in says how publish.txt is generated.
      - name: Install build tools
        run: |
          python -m pip install --require-hashes --only-binary :all: -r .github/requirements/publish.txt

      # A patch release unless the pull request raised MAJOR or MINOR in stable.toml and dev.toml.
      # scripts/stable_release.py says how the two are told apart.
      - name: Pick the release version in stable.toml and dev.toml
        id: bump
        run: python scripts/stable_release.py bump

      - name: Use stable.toml as pyproject.toml
        run: cp stable.toml pyproject.toml

      # --no-isolation: the backend is the setuptools locked in publish.txt, not a fresh download.
      - name: Build distribution
        run: python -m build --no-isolation

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload --non-interactive dist/*

      - name: Commit and tag version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stable.toml dev.toml
          git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          git tag "v${{ steps.bump.outputs.new_version }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.new_version }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.bump.outputs.new_version }}" \
            dist/* \
            --title "v${{ steps.bump.outputs.new_version }}" \
            --generate-notes
